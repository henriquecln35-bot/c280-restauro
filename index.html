<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Garagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1113;
    --surface:#181b1e;
    --surface2:#212528;
    --line:#2b3034;
    --text:#f2efea;
    --text-dim:#9aa1a8;
    --gold:#b08d57;
    --gold-soft:rgba(176,141,87,.14);
    --steel:#5b7c99;
    --danger:#c1666b;
    --success:#7fa98d;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#000;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
    background:radial-gradient(ellipse at top,#1a1d20 0%,#000 70%);
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:40px;
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:rgba(15,17,19,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .emblem{
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:13px;color:var(--gold);
  }
  .brand-text .name{font-size:15px;font-weight:600;line-height:1.1;}
  .brand-text .code{font-size:10.5px;color:var(--text-dim);letter-spacing:.12em;}
  .hero{ padding:20px 18px 4px; }
  .hero .eyebrow{ font-size:11px; letter-spacing:.22em; color:var(--gold); font-weight:600; text-transform:uppercase; }
  .hero h1{ font-family:'Bebas Neue'; font-size:30px; letter-spacing:.03em; margin:2px 0 0; line-height:1; }
  .hero .sub{ color:var(--text-dim); font-size:12.5px; margin-top:4px; }

  .grid{ padding:16px 18px 100px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .car-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; text-decoration:none; color:var(--text); display:block; cursor:pointer;
    transition:border-color .15s ease;
  }
  .car-card:active{ border-color:var(--gold); }
  .car-card .cover{
    width:100%; aspect-ratio:4/3; background:var(--surface2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .car-card .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .car-card .cover .ph{ font-family:'Bebas Neue'; font-size:26px; color:var(--gold); opacity:.55; }
  .car-card .info{ padding:10px 12px 12px; }
  .car-card .cname{ font-size:13.5px; font-weight:600; line-height:1.2; }
  .car-card .cyear{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .car-card.add-card{
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    border-style:dashed; min-height:100%; background:transparent; aspect-ratio:auto;
  }
  .car-card.add-card .plus{
    width:40px;height:40px;border-radius:50%; border:1.5px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:300;
  }
  .car-card.add-card span.lbl{ font-size:12px; color:var(--text-dim); }

  .overlay{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    border:1px solid var(--line); border-bottom:none; padding:20px 18px 26px;
    transform:translateY(16px); transition:transform .18s ease;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet h2{ font-family:'Bebas Neue'; font-size:22px; letter-spacing:.03em; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .field input[type=text], .field input[type=number]{
    width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:15px; box-sizing:border-box; font-family:inherit;
  }
  .cover-pick{
    width:100%; aspect-ratio:4/3; border-radius:12px; border:1.5px dashed var(--line);
    background:var(--surface2); display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative; cursor:pointer;
  }
  .cover-pick img{ width:100%; height:100%; object-fit:cover; display:none; }
  .cover-pick .hint{ font-size:12px; color:var(--text-dim); text-align:center; padding:0 20px; }
  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; border:none; border-radius:11px; padding:13px; font-weight:600; font-size:14.5px; cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{ background:var(--gold); color:#191305; }
  .btn-secondary{ background:var(--surface2); color:var(--text); border:1px solid var(--line); }
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:#20242a; border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:12px; font-size:13px; z-index:400;
    opacity:0; pointer-events:none; transition:all .25s ease; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="loginGate" style="position:fixed; inset:0; z-index:500; background:#0f1113; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:340px;">
    <div style="text-align:center; margin-bottom:24px;">
      <div style="width:52px;height:52px;border-radius:50%;border:1.5px solid #b08d57;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px;color:#b08d57;margin:0 auto 12px;">GN</div>
      <div style="font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.03em; color:#f2efea;">MINHA GARAGEM</div>
      <div style="font-size:11px; color:#9aa1a8; letter-spacing:.1em; margin-top:2px;">ACESSO RESTRITO</div>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:11px; color:#9aa1a8; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px;">Usu&#225;rio</label>
      <input type="text" id="loginUser" autocapitalize="off" autocomplete="username" style="width:100%; background:#212528; border:1px solid #2b3034; color:#f2efea; border-radius:10px; padding:12px 14px; font-size:15px; box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:11px; color:#9aa1a8; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px;">Senha</label>
      <input type="password" id="loginPass" autocomplete="current-password" style="width:100%; background:#212528; border:1px solid #2b3034; color:#f2efea; border-radius:10px; padding:12px 14px; font-size:15px; box-sizing:border-box;">
    </div>
    <div id="loginError" style="display:none; color:#c1666b; font-size:12.5px; margin-bottom:14px; text-align:center;">Usu&#225;rio ou senha incorretos.</div>
    <button id="loginBtn" style="width:100%; background:#b08d57; color:#191305; border:none; border-radius:11px; padding:12px; font-weight:600; font-size:14.5px; cursor:pointer;">Entrar</button>
  </div>
</div>

<script>
(function(){
  var APP_USERS = {
    'henrique': '01020304',
    'ronaldo': '180505',
    'rafaela': '040691'
  };
  var gate = document.getElementById('loginGate');
  var userInput = document.getElementById('loginUser');
  var passInput = document.getElementById('loginPass');
  var errorEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  function tryLogin(){
    var u = (userInput.value || '').trim().toLowerCase();
    var p = passInput.value || '';
    if(APP_USERS[u] && APP_USERS[u] === p){
      try{ localStorage.setItem('c280_auth_user', u); }catch(e){}
      gate.style.display = 'none';
    }else{
      errorEl.style.display = 'block';
    }
  }
  btn.addEventListener('click', tryLogin);
  passInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
  userInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') passInput.focus(); });

  try{
    var savedUser = localStorage.getItem('c280_auth_user');
    if(savedUser && APP_USERS[savedUser]){
      gate.style.display = 'none';
    }
  }catch(e){}
})();
</script>

<div id="app">
  <header>
    <div class="brand">
      <div class="emblem">GN</div>
      <div class="brand-text">
        <div class="name">Garagem</div>
        <div class="code">S&#211;CIOS &#183; RONALDO &amp; HENRIQUE</div>
      </div>
    </div>
  </header>

  <div class="hero">
    <div class="eyebrow">Restauro de ve&#237;culos</div>
    <h1>NOSSA GARAGEM</h1>
    <div class="sub">Escolha um carro para ver despesas, aportes e evolu&#231;&#227;o</div>
  </div>

  <div class="grid" id="carsGrid">
    <div class="car-card add-card" id="addCardBtn">
      <div class="plus">+</div>
      <span class="lbl">Adicionar carro</span>
    </div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h2>Novo carro</h2>
    <div class="field">
      <label for="carCoverInput">Foto de capa</label>
      <div class="cover-pick" id="coverPick">
        <img id="coverPreview" alt="Pr&#233;via da foto de capa">
        <div class="hint" id="coverHint">Toque para escolher uma foto<br>(como uma foto de perfil do carro)</div>
      </div>
      <input type="file" id="carCoverInput" accept="image/*" class="hidden">
    </div>
    <div class="field">
      <label for="carNameInput">Nome do carro</label>
      <input type="text" id="carNameInput" placeholder="Ex: Fusca 1963">
    </div>
    <div class="field">
      <label for="carYearInput">Ano</label>
      <input type="text" id="carYearInput" placeholder="Ex: 1963" inputmode="numeric">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="cancelAddCar">Cancelar</button>
      <button class="btn btn-primary" id="saveCarBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- toast ---------------- */
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

/* ---------------- firebase (mesmo projeto usado pelo restante do app) ---------------- */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDAlYVRQRSGJ_KOL6BKu8Gu4oJI62Jnx2Y",
  authDomain: "c280-restauro.firebaseapp.com",
  projectId: "c280-restauro",
  storageBucket: "c280-restauro.firebasestorage.app",
  messagingSenderId: "331243316719",
  appId: "1:331243316719:web:7ccbe7893bcc27e24f821a"
};
var storageMode = 'local';
var firestoreDb = null;
var garageCollRef = null;

function loadScriptOnce(src, timeoutMs){
  return new Promise(function(resolve, reject){
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done = true; reject(new Error('tempo esgotado')); } }, timeoutMs || 7000);
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ if(!done){ done = true; clearTimeout(timer); resolve(); } };
    s.onerror = function(){ if(!done){ done = true; clearTimeout(timer); reject(new Error('falha ao carregar')); } };
    document.head.appendChild(s);
  });
}

async function ensureFirebaseSdkLoaded(){
  if(typeof firebase !== 'undefined') return true;
  var urls = [
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'
  ];
  for(var attempt = 0; attempt < 3; attempt++){
    try{
      for(var i=0;i<urls.length;i++){ await loadScriptOnce(urls[i], 6000); }
      if(typeof firebase !== 'undefined') return true;
    }catch(e){
      console.error('tentativa ' + (attempt+1) + ' de carregar o SDK do Firebase falhou:', e);
    }
  }
  return typeof firebase !== 'undefined';
}

async function detectStorageMode(){
  if(typeof firebase === 'undefined'){
    await ensureFirebaseSdkLoaded();
  }
  if(typeof firebase !== 'undefined'){
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      firestoreDb = firebase.firestore();
      garageCollRef = firestoreDb.collection('garagem-carros');
      storageMode = 'firebase';
      return;
    }catch(e){
      console.error('Firebase falhou, usando armazenamento local:', e);
    }
  }
  storageMode = 'local';
}

/* ---------------- compressao de imagem (foto de capa) ---------------- */
function loadImageFromFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('N\u00e3o foi poss\u00edvel ler o arquivo')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('Arquivo de imagem inv\u00e1lido')); };
      img.onload = function(){ resolve(img); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function encodeImageAt(img, maxWidth, quality){
  var scale = Math.min(1, maxWidth / img.width);
  var w = Math.round(img.width * scale);
  var h = Math.round(img.height * scale);
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}
async function compressImageToTarget(file, targetBytes, startWidth, startQuality){
  var img = await loadImageFromFile(file);
  var width = startWidth;
  var quality = startQuality;
  var dataUrl = encodeImageAt(img, width, quality);
  var attempts = 0;
  while(dataUrl.length > targetBytes && attempts < 7){
    if(quality > 0.38){
      quality = Math.max(0.38, quality - 0.1);
    }else{
      width = Math.max(480, Math.round(width * 0.82));
    }
    dataUrl = encodeImageAt(img, width, quality);
    attempts++;
  }
  return dataUrl;
}

/* ---------------- lista de carros ---------------- */
var C280_CARD = { id:'c280', name:'Mercedes-Benz C280', year:'1995', cover:null, href:'c280.html', pinned:true };
var extraCars = [];

function slugify(name){
  return (name || 'carro')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-+|-+$)/g, '') || 'carro';
}

async function loadCars(){
  try{
    if(storageMode === 'firebase' && garageCollRef){
      var snap = await garageCollRef.get();
      extraCars = snap.docs
        .map(function(d){ var v = d.data() || {}; return { id:d.id, name:v.name || 'Carro', year:v.year || '', cover:v.cover || null, createdAt:v.createdAt || 0 }; })
        .sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
      try{ localStorage.setItem('garagem_cars_cache', JSON.stringify(extraCars)); }catch(e){}
      return;
    }
  }catch(e){
    console.error('n\u00e3o foi poss\u00edvel carregar a lista de carros da nuvem:', e);
  }
  try{
    var cached = localStorage.getItem('garagem_cars_cache');
    extraCars = cached ? JSON.parse(cached) : [];
  }catch(e){
    extraCars = [];
  }
}

// mant\u00e9m a garagem sincronizada em tempo real -- assim que algu\u00e9m adiciona um
// carro em outro aparelho, ele aparece aqui sozinho, sem precisar recarregar a p\u00e1gina
function subscribeGarageRealtime(){
  if(storageMode !== 'firebase' || !garageCollRef) return;
  garageCollRef.onSnapshot(function(snap){
    extraCars = snap.docs
      .map(function(d){ var v = d.data() || {}; return { id:d.id, name:v.name || 'Carro', year:v.year || '', cover:v.cover || null, createdAt:v.createdAt || 0 }; })
      .sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
    try{ localStorage.setItem('garagem_cars_cache', JSON.stringify(extraCars)); }catch(e){}
    renderCars();
  }, function(err){
    console.error('erro na sincroniza\u00e7\u00e3o da lista de carros:', err);
  });
}

function carCardHtml(car){
  var coverInner = car.cover
    ? '<img src="'+car.cover+'" alt="'+car.name+'">'
    : '<span class="ph">'+(car.id === 'c280' ? 'MB' : (car.name||'?').slice(0,2).toUpperCase())+'</span>';
  return (
    '<a class="car-card" href="'+(car.href || ('carro.html?id='+encodeURIComponent(car.id)))+'">' +
      '<div class="cover">'+coverInner+'</div>' +
      '<div class="info">' +
        '<div class="cname">'+car.name+'</div>' +
        '<div class="cyear">'+(car.year || '&nbsp;')+'</div>' +
      '</div>' +
    '</a>'
  );
}

function renderCars(){
  var grid = document.getElementById('carsGrid');
  var html = carCardHtml(C280_CARD);
  extraCars.forEach(function(car){ html += carCardHtml(car); });
  html += (
    '<div class="car-card add-card" id="addCardBtn">' +
      '<div class="plus">+</div>' +
      '<span class="lbl">Adicionar carro</span>' +
    '</div>'
  );
  grid.innerHTML = html;
  document.getElementById('addCardBtn').addEventListener('click', openAddOverlay);
}

/* ---------------- adicionar carro ---------------- */
var addOverlay = document.getElementById('addOverlay');
var coverPick = document.getElementById('coverPick');
var coverInput = document.getElementById('carCoverInput');
var coverPreview = document.getElementById('coverPreview');
var coverHint = document.getElementById('coverHint');
var pendingCoverDataUrl = null;

function openAddOverlay(){
  document.getElementById('carNameInput').value = '';
  document.getElementById('carYearInput').value = '';
  pendingCoverDataUrl = null;
  coverPreview.style.display = 'none';
  coverPreview.src = '';
  coverHint.style.display = 'block';
  addOverlay.classList.add('open');
}
function closeAddOverlay(){ addOverlay.classList.remove('open'); }

document.getElementById('cancelAddCar').addEventListener('click', closeAddOverlay);
addOverlay.addEventListener('click', function(e){ if(e.target === addOverlay) closeAddOverlay(); });

coverPick.addEventListener('click', function(){ coverInput.click(); });
coverInput.addEventListener('change', async function(){
  var file = coverInput.files && coverInput.files[0];
  if(!file) return;
  try{
    showToast('Preparando a foto...');
    pendingCoverDataUrl = await compressImageToTarget(file, 220000, 900, 0.72);
    coverPreview.src = pendingCoverDataUrl;
    coverPreview.style.display = 'block';
    coverHint.style.display = 'none';
  }catch(e){
    console.error(e);
    showToast('N\u00e3o foi poss\u00edvel usar essa foto');
  }
});

document.getElementById('saveCarBtn').addEventListener('click', async function(){
  var name = (document.getElementById('carNameInput').value || '').trim();
  var year = (document.getElementById('carYearInput').value || '').trim();
  if(!name){
    showToast('D\u00ea um nome para o carro');
    return;
  }
  var id = slugify(name) + '-' + Math.random().toString(36).slice(2,6);
  var car = { id:id, name:name, year:year, cover:pendingCoverDataUrl || null, createdAt:Date.now() };

  extraCars.push(car);
  renderCars();
  closeAddOverlay();

  try{ localStorage.setItem('garagem_cars_cache', JSON.stringify(extraCars)); }catch(e){}

  try{
    if(storageMode === 'firebase' && garageCollRef){
      await garageCollRef.doc(id).set({
        name: car.name, year: car.year, cover: car.cover, createdAt: car.createdAt
      });
      showToast('Carro adicionado - ' + name);
    }else{
      showToast('Carro salvo neste aparelho (sem sincroniza\u00e7\u00e3o com a nuvem agora)');
    }
  }catch(e){
    console.error(e);
    showToast('Carro salvo aqui, mas n\u00e3o foi poss\u00edvel enviar para a nuvem agora');
  }
});

/* ---------------- init ---------------- */
(async function init(){
  // mostra na hora a ultima lista que ficou salva neste aparelho (sem esperar a
  // nuvem responder) -- assim a tela nao fica vazia enquanto o Firebase conecta.
  // Quando a nuvem responder de verdade, a lista e atualizada sozinha por baixo.
  try{
    var cached = localStorage.getItem('garagem_cars_cache');
    if(cached) extraCars = JSON.parse(cached);
  }catch(e){}
  renderCars();

  await detectStorageMode();
  if(storageMode === 'firebase'){
    subscribeGarageRealtime();
  }else{
    await loadCars();
    renderCars();
  }
})();
</script>

</body>
</html>
